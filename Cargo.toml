[package]
name = "parley"
version = "0.1.0"
edition = "2024"
description = "Matrix bot that lets people talk to home-lab agents. Each room talks to an agent through a swappable harness."
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
cron = "0.15"
dirs = "6"
futures-util = "0.3"
mime = "0.3"
matrix-sdk = { version = "0.19.1", features = ["markdown"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "fs", "process", "time", "sync"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[package]
name = "parley"
version = "0.1.0"
edition = "2024"
description = "Matrix bot that lets people talk to home-lab agents. Step 1: an end-to-end encrypted echo."
license = "MIT"

[dependencies]
anyhow = "1"
dirs = "6"
matrix-sdk = "0.19.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
